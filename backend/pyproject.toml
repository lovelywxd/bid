[project]
name = "bid-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6", "uvicorn==0.34.0", "sqlalchemy==2.0.36",
  "alembic==1.14.0", "pydantic==2.10.4", "httpx==0.28.1",
  "psycopg[binary]==3.2.3", "pyyaml==6.0.2"
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.9.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
